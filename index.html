<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stationary Ball</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  body { touch-action: none; user-select: none; font: 14px system-ui, sans-serif; }
  #ball { position: fixed; width: 13px; height: 13px; border-radius: 50%; background: #000; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  #hint { position: fixed; bottom: max(32px, env(safe-area-inset-bottom)); left: 20px; right: 20px; text-align: center; color: #666; line-height: 1.5; pointer-events: none; }
</style>
</head>
<body>
<div id="ball" aria-label="Black ball"></div>
<div id="hint">Hold your phone flat, then tap to begin.</div>
<script>
(() => {
  'use strict';
  const ball = document.getElementById('ball');
  const hint = document.getElementById('hint');
  // Approximate CSS pixels per physical metre on a typical smartphone.
  // Override using ?scale=6000 (larger values increase movement).
  const scale = Number(new URLSearchParams(location.search).get('scale')) || 6000;
  const rad = Math.PI / 180;
  const accelerationDeadband = 0.25; // m/s²
  const filterTime = 0.045; // seconds
  let state = 'idle', last = 0, calibrationAt = 0, samples = [], quiet = 0;
  let p = [0, 0], v = [0, 0], bias = [0, 0], prev = [0, 0], filtered = [0, 0];
  let orientation = null, initialYaw = null, initialScreenAngle = 0;
  let timer;

  const valid = a => a && [a.x, a.y, a.z].every(Number.isFinite);
  // Device-to-world rotation: Z(alpha), X(beta), Y(gamma).
  function basis() {
    const {alpha = 0, beta = 0, gamma = 0} = orientation || {};
    const a = (alpha - (initialYaw ?? alpha)) * rad, b = beta * rad, g = gamma * rad;
    const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), cg = Math.cos(g), sg = Math.sin(g);
    return [
      [ca*cg-sa*sb*sg, -sa*cb, ca*sg+sa*sb*cg],
      [sa*cg+ca*sb*sg, ca*cb, sa*sg-ca*sb*cg]
    ];
  }
  function screenBasis() {
    // The display axes are fixed at calibration, never tilted or rotated
    // by later changes in the phone's attitude.
    const c = Math.cos(initialScreenAngle), s = Math.sin(initialScreenAngle);
    return [[c, s], [-s, c]];
  }
  function draw() {
    const [right, up] = screenBasis();
    // Phone displacement is subtracted from the stationary world point.
    const x = -(p[0]*right[0]+p[1]*right[1])*scale;
    const y = (p[0]*up[0]+p[1]*up[1])*scale;
    // Keep the entire ball inside the viewport, including its radius.
    const maxX = Math.max(0, (document.documentElement.clientWidth - ball.offsetWidth) / 2);
    const maxY = Math.max(0, (document.documentElement.clientHeight - ball.offsetHeight) / 2);
    const clampedX = Math.max(-maxX, Math.min(maxX, x));
    const clampedY = Math.max(-maxY, Math.min(maxY, y));
    // Discard movement beyond the edge so reversing moves the ball immediately.
    const det = right[0]*up[1] - right[1]*up[0];
    if ((x !== clampedX || y !== clampedY) && Math.abs(det) > .05) {
      const sx = -clampedX / scale, sy = clampedY / scale;
      p = [(sx*up[1]-right[1]*sy)/det, (right[0]*sy-sx*up[0])/det];
    }
    ball.style.left = `calc(50% + ${clampedX}px)`;
    ball.style.top = `calc(50% + ${clampedY}px)`;
    requestAnimationFrame(draw);
  }
  addEventListener('deviceorientation', e => {
    if ([e.alpha,e.beta,e.gamma].every(Number.isFinite)) orientation = e;
  });
  function calibrate() {
    clearTimeout(timer);
    state = 'calibrating'; calibrationAt = performance.now(); last = 0;
    p = [0, 0]; v = [0, 0]; bias = [0, 0]; prev = [0, 0]; filtered = [0, 0];
    samples = []; quiet = 0;
    initialYaw = orientation?.alpha ?? null;
    initialScreenAngle = (screen.orientation?.angle ?? window.orientation ?? 0) * rad;
    hint.textContent = 'Keep still for a moment…';
    timer = setTimeout(() => {
      if (state === 'calibrating') {
        state = 'idle';
        hint.textContent = 'No motion data. Open in a mobile browser over HTTPS and tap to try again.';
      }
    }, 4000);
  }
  function motion(e) {
    if (state !== 'calibrating' && state !== 'running') return;
    const now = performance.now();
    // Orientation is needed to distinguish horizontal from vertical motion.
    if (!orientation) return;
    if (initialYaw === null) initialYaw = orientation.alpha;
    const a = valid(e.acceleration) ? e.acceleration : e.accelerationIncludingGravity;
    if (!valid(a)) return;
    // Rotate into a fixed ground frame BEFORE discarding the vertical axis.
    // If only gravity-inclusive data is available, gravity is vertical in this
    // frame and is discarded along with any vertical translation.
    const r = basis();
    const world = r.map(row => row[0]*a.x+row[1]*a.y+row[2]*a.z);
    if (state === 'calibrating') {
      samples.push(world);
      if (now-calibrationAt < 850 || samples.length < 8) return;
      bias = [0,1].map(i => samples.reduce((s,a) => s+a[i],0)/samples.length);
      clearTimeout(timer); state = 'running'; last = now; hint.textContent = '';
      return;
    }
    const dt = (now-last)/1000; last = now;
    if (dt <= 0 || dt > .15) { v = [0,0]; prev = [0,0]; filtered = [0,0]; return; }
    // Time-based low-pass filter smooths short sensor spikes and vibrations.
    const mix = 1 - Math.exp(-dt / filterTime);
    filtered = world.map((a,i) => filtered[i] + mix * (a - bias[i] - filtered[i]));
    let acc = filtered.slice();
    // Sensor fusion may leave small acceleration residuals during rotation.
    // Filter those while retaining larger genuine horizontal accelerations.
    const rr = e.rotationRate;
    const angularSpeed = rr ? Math.hypot(rr.alpha || 0, rr.beta || 0, rr.gamma || 0) : 0;
    const still = Math.hypot(...acc) < (angularSpeed > 12 ? .40 : accelerationDeadband);
    quiet = still ? quiet+dt : 0;
    if (still) acc = [0,0];
    // Trapezoidal integration with a zero-velocity correction during pauses.
    if (quiet > .20) { v = [0,0]; prev = [0,0]; return; }
    for (let i=0;i<2;i++) {
      const next = v[i]+(prev[i]+acc[i])*.5*dt;
      p[i] += .5*(v[i]+next)*dt;
      v[i] = next;
    }
    prev = acc;
  }
  addEventListener('devicemotion', motion);
  addEventListener('pointerdown', async () => {
    if (state === 'requesting') return;
    if (state === 'running' || state === 'calibrating') { calibrate(); return; }
    state = 'requesting';
    try {
      const requests = [];
      for (const api of [window.DeviceMotionEvent, window.DeviceOrientationEvent]) {
        if (typeof api?.requestPermission === 'function') requests.push(api.requestPermission());
      }
      const results = await Promise.all(requests);
      if (results.includes('denied')) throw Error('Permission denied');
      calibrate();
    } catch (_) {
      state = 'idle'; hint.textContent = 'Motion access unavailable. Allow motion sensors and tap to retry.';
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'running') { state = 'idle'; hint.textContent = 'Tap to recalibrate.'; } });
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
